[package]
name = "arclight"
version = "0.1.1"
description = "Arclight — the D-Net Lab workspace"
authors = ["D-Net Lab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arclight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
parking_lot = "0.12.5"
axum = "0.8.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "net", "macros"] }
futures = "0.3.34"
uuid = { version = "1.20.0", features = ["v4"] }
async-stream = "0.3.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
